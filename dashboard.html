<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget Planner - Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Budget Planner
        </div>

        <div class="user-area">

            <span id="welcomeUser">
                Welcome
            </span>

            <button id="logoutBtn" class="logout-button">
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="dashboard">

        <!-- SUMMARY CARDS -->

        <section class="summary-grid">

            <div class="summary-card income">

                <h3>
                    Total Income
                </h3>

                <p id="totalIncome">
                    ₹0.00
                </p>

            </div>


            <div class="summary-card expense">

                <h3>
                    Total Expense
                </h3>

                <p id="totalExpense">
                    ₹0.00
                </p>

            </div>


            <div class="summary-card balance">

                <h3>
                    Balance
                </h3>

                <p id="balance">
                    ₹0.00
                </p>

            </div>

        </section>


        <!-- MAIN GRID -->

        <section class="main-grid">


            <!-- ADD TRANSACTION -->

            <div class="form-card">

                <h2>
                    Add Transaction
                </h2>

                <form id="transactionForm">

                    <label for="transactionType">
                        Type
                    </label>

                    <select id="transactionType">

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>


                    <label for="transactionTitle">
                        Description
                    </label>

                    <input
                        type="text"
                        id="transactionTitle"
                        placeholder="Example: Salary"
                        required
                    >


                    <label for="transactionAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="transactionAmount"
                        placeholder="Enter amount"
                        min="1"
                        required
                    >


                    <button type="submit">
                        Add Transaction
                    </button>

                </form>

            </div>


            <!-- TRANSACTION HISTORY -->

            <div class="history-card">

                <h2>
                    Transaction History
                </h2>

                <div id="transactionList">

                    <p class="empty">
                        No transactions yet.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
